name: Sync HukumKu

on:
  schedule:
    # Setiap 6 jam: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger dari GitHub UI

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run sync
        run: |
          curl -sf "${{ vars.SITE_URL || 'https://hukumku.vercel.app' }}/api/cron/sync?secret=${{ secrets.CRON_SECRET }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            --retry 2 \
            --retry-delay 30
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
